  status = 200
  force = true

# Labs · EARLY (SYNC Proof). Everything answers closed unless SYNCNET_EARLY_ENABLED=true with a durable store
# (netlify/lib/early-config.js). Money never touches these functions: the fan's wallet pays the creator's wallet directly.
[[redirects]]
  from = "/api/early"
  to = "/.netlify/functions/early"
  status = 200
  force = true

[[redirects]]
