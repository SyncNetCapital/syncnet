# PONS V2 discovery: incremental indexer. Scheduled only (no /api route); it does nothing unless
# SYNCNET_PONS_DISCOVERY_ENABLED=true AND the backfill script has seeded its cursor.
[functions."pons-indexer"]
  schedule = "*/10 * * * *"

# Solana Pump.fun discovery (non-SOL quotes): bounded, paginated read API. 404 {enabled:false} unless
# SYNCNET_PUMP_DISCOVERY_ENABLED=true (plus a durable store).
[[redirects]]
  from = "/api/pump-economy"
  to = "/.netlify/functions/pump-economy"
  status = 200
  force = true

# Solana Pump.fun discovery: incremental indexer. Scheduled only (no /api route); it does nothing unless
# SYNCNET_PUMP_DISCOVERY_ENABLED=true, SYNCNET_SOLANA_RPC_URL is set AND pump-backfill has seeded its checkpoint.
# ~52k Pump creates/day (~36/min): every minute, at most 300 signatures per run.
[functions."pump-indexer"]
  schedule = "* * * * *"

[[redirects]]
  from = "/api/project-home"
