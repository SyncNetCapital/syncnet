  status = 200

[[redirects]]
  from = "/labs/early/*"
  to = "/labs-early.html"
  status = 200

# EARLY scheduled maintenance (no /api route): hourly at :05 — daily UTC audience snapshots (first success of the day
# wins), due wallet rotations, finality reconciliation. Does nothing unless SYNCNET_EARLY_ENABLED=true.
[functions."early-snapshot"]
  schedule = "5 * * * *"

# EARLY anchoring (no /api route): 00:20 UTC builds yesterday's bundle; :50 every hour retries anchors / OTS upgrades.
# The ONE server-sent transaction in SyncNet: a zero-value self-transfer from the registry anchor key carrying the
# Merkle root. Off unless SYNCNET_EARLY_ENABLED=true and the anchor key is configured; SYNCNET_EARLY_ANCHOR_DISABLED=true stops it.
[functions."early-anchor"]
  schedule = "20,50 * * * *"

# Project Home public renderer and its image route. Both answer 404 unless SYNCNET_PROJECT_HOME_ENABLED=true.
[[redirects]]
  from = "/site/:token"
  to = "/.netlify/functions/site?token=:token"
  status = 200
  force = true

[[redirects]]
