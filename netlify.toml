[[redirects]]
  from = "/token/*"
  to = "/token.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' https: data: blob:; connect-src 'self' http://127.0.0.1:8545 http://localhost:8545 https://api.par.family https://par.family https://rpc.mainnet.chain.robinhood.com https://ipfs.io https://dweb.link; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'"

[[redirects]]
  from = "/api/par-tokenlist"
  to = "/.netlify/functions/par-tokenlist"
  status = 200
  force = true


